name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test application with PostgreSQL
        env:
          ARTEX_PG_DSN: postgres://artex_test:local-ci-only@127.0.0.1:5432/artex_test?sslmode=disable
        run: go test -p 1 ./...
      - name: Test executor lifecycle and concurrency
        working-directory: third_party/norma
        run: go test -race ./...
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

