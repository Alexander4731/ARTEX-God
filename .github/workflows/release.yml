name: release
on:
  push:
    tags: ["v*", "[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 Release 需要

jobs:
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Linux / macOS 交叉编译；Windows 使用下面的便携包构建。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_UPDATE_REPO: ${{ github.repository }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # Windows 的第三方运行库复用已验证的固定版本；应用、启动器和前端
  # 始终从当前 tag 编译。SHA-256 固定在仓库中，不接受被替换的基础包。
  windows:
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build Windows portable package
        shell: pwsh
        env:
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          ./packaging/windows/release.ps1 -Version $env:ARTEX_BUILD_VERSION -WorkDirectory "$env:RUNNER_TEMP/portable-build" -OutputDirectory "$env:GITHUB_WORKSPACE/dist"
      - name: Smoke test the packaged release in a clean Unicode path
        shell: pwsh
        env:
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          $name = "artex-$($env:ARTEX_BUILD_VERSION.TrimStart('v'))-windows-amd64"
          $destination = Join-Path $env:RUNNER_TEMP 'ARTEX 全新环境'
          Expand-Archive -LiteralPath "dist/$name.zip" -DestinationPath $destination
          ./packaging/windows/smoke.ps1 -PackageDirectory (Join-Path $destination $name) -OutputDirectory "$env:RUNNER_TEMP/portable-smoke"
          $result = Get-Content -LiteralPath "$env:RUNNER_TEMP/portable-smoke/result.json" -Raw | ConvertFrom-Json
          if ($result.health.version -ne $env:ARTEX_BUILD_VERSION.TrimStart('v')) { throw 'The package contains the wrong application version.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-portable-smoke
          path: ${{ runner.temp }}/portable-smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-amd64
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  # ③ 全部构建与 Windows 启动测试成功后创建 Release。
  release:
    needs: [binaries, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # ④ 多架构镜像 → 推 Docker Hub（复用 binaries 编好的 Linux 二进制，
  #    镜像里只装工具 + 放二进制；arm64 仅需模拟 apt 层，构建快很多）
  docker:
    # Fork 默认只发布 GitHub Release；镜像仓库须显式配置后启用。
    if: vars.PUBLISH_DOCKER == 'true' && vars.DOCKER_IMAGE != ''
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKER_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
